name: Configure registry reader authentication
description: Mint a read-only package token and configure Composer to use it.

inputs:
  client-id:
    description: GitHub App Client ID for composer-registry-reader.
    required: true
  private-key:
    description: GitHub App private key for composer-registry-reader.
    required: true

runs:
  using: composite
  steps:
    - id: github-repositories
      shell: bash
      run: |
        jq -e '
          [.repositories[] | select(.type == "vcs") | .url]
          | . == ["https://github.com/astraonelabs/access-control.git"]
        ' satis.json >/dev/null || {
          echo "Reader refused: only the approved Access Control source is permitted." >&2
          exit 1
        }

    - id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: astraonelabs
        repositories: access-control
        permission-contents: read

    - shell: bash
      env:
        COMPOSER_HOME: ${{ runner.temp }}/composer
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        mkdir -p "$COMPOSER_HOME"
        composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"
