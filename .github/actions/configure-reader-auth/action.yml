name: Configure registry reader authentication
description: Mint a read-only package token and configure Composer to use it.

inputs:
  app-id:
    description: GitHub App ID for composer-registry-reader.
    required: true
  private-key:
    description: GitHub App private key for composer-registry-reader.
    required: true

runs:
  using: composite
  steps:
    - id: github-repositories
      shell: bash
      run: |
        repositories="$({
          jq -er '
            [
              .repositories[]
              | select(.type == "vcs")
              | .url
              | select(startswith("https://github.com/astraonelabs/"))
              | sub("^https://github\\.com/astraonelabs/"; "")
              | sub("\\.git$"; "")
            ]
            | unique
            | if length > 0 then join(",") else error("no Astra One Labs GitHub VCS repositories configured") end
          ' satis.json
        })"
        echo "names=$repositories" >> "$GITHUB_OUTPUT"

    - id: app-token
      uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: astraonelabs
        repositories: ${{ steps.github-repositories.outputs.names }}

    - shell: bash
      env:
        COMPOSER_HOME: ${{ runner.temp }}/composer
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        mkdir -p "$COMPOSER_HOME"
        composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"
