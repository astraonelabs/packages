name: publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Require manual publication from trusted main
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REPOSITORY" != astraonelabs/packages || "$GITHUB_REF" != refs/heads/main || "$GITHUB_ACTOR" == 'dependabot[bot]' || "$GITHUB_TRIGGERING_ACTOR" == 'dependabot[bot]' ]]; then
            echo "Publication refused: dispatch must use trusted Packages main." >&2
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/configure-reader-auth
        with:
          client-id: ${{ vars.COMPOSER_REGISTRY_READER_CLIENT_ID }}
          private-key: ${{ secrets.COMPOSER_REGISTRY_READER_PRIVATE_KEY }}

      - name: Build Composer metadata
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
        run: bash scripts/build-catalog.sh satis.json public

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-consumer:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - uses: ./.github/actions/configure-reader-auth
        with:
          client-id: ${{ vars.COMPOSER_REGISTRY_READER_CLIENT_ID }}
          private-key: ${{ secrets.COMPOSER_REGISTRY_READER_PRIVATE_KEY }}

      - name: Install from published catalog
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
          PACKAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p "$COMPOSER_HOME" "$RUNNER_TEMP/consumer"
          curl --fail --retry 12 --retry-delay 5 "${PACKAGES_URL%/}/packages.json" >/dev/null
          cd "$RUNNER_TEMP/consumer"
          composer init --name=astraone/catalog-verification --no-interaction
          composer config repositories.astraone composer "$PACKAGES_URL"
          mapfile -t packages < <(jq -r '.require | keys[]' "$GITHUB_WORKSPACE/satis.json")
          test "${#packages[@]}" -gt 0
          composer require "${packages[@]}" --no-interaction --no-progress
